name: Android build

on:
  workflow_dispatch:
  push:
    branches: [claude/belle-integration]
    paths: ['src/emu/**', '.github/workflows/android.yml']

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/emu/android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" "cmake;3.22.1" >/dev/null

      - name: Build release
        run: ./gradlew assembleRelease -PciArg='-DCI=ON' --no-daemon

      - name: Sign
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$GITHUB_WORKSPACE/keystore/eka21.jks" --ks-pass pass:belleui1 --key-pass pass:belleui1 --out "$GITHUB_WORKSPACE/EKA21-Belle.apk" aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EKA21-Belle
          path: EKA21-Belle.apk
